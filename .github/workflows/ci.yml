name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: C# build, test, validate fleet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      # The same gate a pull request against fleet/ has to pass.
      - name: Validate fleet configuration
        run: |
          dotnet run -c Release --no-build --project src/Dreadnought.Cli -- validate fleet
          dotnet run -c Release --no-build --project src/Dreadnought.Cli -- validate demo/fleet

  analytics:
    name: Python lint, types, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest

  end-to-end:
    name: Demo as end-to-end test
    runs-on: ubuntu-latest
    needs: [control-plane, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: dotnet build src/Dreadnought.ControlPlane
      - run: python demo/run.py
